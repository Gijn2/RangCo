<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>페이지 오류</title>
    <style>
        body { text-align: center; padding: 50px; font-family: sans-serif; }
        .error-code { font-size: 50px; color: #ff4d4f; }
        .message { font-size: 20px; margin: 20px 0; }
        .btn-home {
            padding: 10px 20px; background-color: #007bff;
            color: white; text-decoration: none; border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="error-code" th:text="${code}">500</div>
<div class="message">
    <p th:text="${msg}">현재 페이지에 오류가 생겼습니다.</p>
    <p>메인페이지로 이동해주세요.</p>
</div>
<button th:href="${/}" class="btn-home">메인페이지로 이동</button>
</body>
</html>
